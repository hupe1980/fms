name: Release

# Push an annotated tag to cut a release — crates.io, binaries, the release page, and the
# Homebrew formula in hupe1980/homebrew-tap (`brew install hupe1980/tap/fms`):
#
#   just release-check
#   git tag -a v0.2.0 -m 'v0.2.0' && git push origin v0.2.0
#
# `workflow_dispatch` runs everything except the irreversible steps (crates.io, the release
# page), so the whole pipeline can be rehearsed on a branch before a tag exists.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

# One release at a time, and never cancelled: a half-finished publish is worse than a slow one.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  # Everything that can say "no" cheaply, before six machines start building.
  guard:
    name: guard
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      # A crates.io version is immutable and a tag is not, so the tag is checked against the
      # manifest rather than the other way round.
      - name: The tag and Cargo.toml must agree
        id: version
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = "push" ]; then
            tag="${GITHUB_REF_NAME}"
            if [ "$tag" != "v$version" ]; then
              echo "::error::tag $tag does not match Cargo.toml version $version (expected v$version)"
              exit 1
            fi
          else
            tag="v$version"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "releasing $tag"

      # The release note is the changelog entry; a version without one is not ready.
      - name: CHANGELOG.md has an entry for this version
        run: grep -q "^## \[${{ steps.version.outputs.version }}\]" CHANGELOG.md

      # The packaged crate is not the working tree: `include` keeps src/, the README, the
      # changelog and the licences. A crate that only builds because of a file it does not ship
      # fails here, not on crates.io — and the list shows that no internal note slipped in.
      - name: The published package builds from what it ships
        run: cargo publish --dry-run --locked
      - name: Show what would be published
        run: |
          cargo package --list --locked | tee files.txt
          if grep -E '^(concepts|specs|\.specify|\.claude|site|tests)/' files.txt; then
            echo "::error::the package would ship internal or test files"; exit 1
          fi

  # The release gate is CI itself — fmt, clippy, every test, the pandapower oracle, MSRV,
  # cargo-deny — invoked rather than copied.
  ci:
    name: ci
    needs: guard
    uses: ./.github/workflows/ci.yml

  # The `fms` binary for a DSO's laptop or a jump host without a Rust toolchain. No C
  # dependencies, so every target builds natively.
  binaries:
    name: fms ${{ matrix.target }}
    needs: [guard, ci]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-latest }
          # Statically linked: one file that runs on any Linux.
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest, packages: musl-tools }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-24.04-arm }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm, packages: musl-tools }
          - { target: aarch64-apple-darwin, os: macos-latest }
          - { target: x86_64-pc-windows-msvc, os: windows-latest }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - if: matrix.packages
        run: sudo apt-get update && sudo apt-get install -y ${{ matrix.packages }}
      - run: cargo build --release --locked --bin fms --target ${{ matrix.target }}

      # Every target is built on its own architecture, so the binary in the archive is also the
      # binary that runs a reference day here: an archive nobody ran is a guess.
      - name: Package
        shell: bash
        run: |
          name="fms-${{ needs.guard.outputs.tag }}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          if [ "${{ runner.os }}" = "Windows" ]; then bin=fms.exe; else bin=fms; fi
          cp "target/${{ matrix.target }}/release/$bin" "dist/$name/$bin"
          [ "$bin" = fms ] && strip "dist/$name/$bin" || true
          cp README.md CHANGELOG.md LICENSE-MIT LICENSE-APACHE "dist/$name/"
          "./dist/$name/$bin" --version
          "./dist/$name/$bin" sim pv-noon > /dev/null
          cd dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a "$name.zip" "$name" > /dev/null
          else
            tar -czf "$name.tar.gz" "$name"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: fms-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error

  # The only step that cannot be taken back. It runs once the gate has passed, the dry run has
  # succeeded, and every binary has been built and has run a day.
  crates-io:
    name: crates.io
    needs: [guard, ci, binaries]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    # crates.io Trusted Publishing: the job exchanges its OIDC identity for a short-lived token,
    # so no registry secret is stored. Put a required reviewer on the environment if a publish
    # should need a human.
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # A version already on crates.io — published by hand, or by an earlier run whose later
      # jobs failed — is not published again; the release page still follows.
      - name: Is this version already published?
        id: published
        run: |
          status=$(curl -s -o /dev/null -w '%{http_code}' -A "fms release workflow" \
            "https://crates.io/api/v1/crates/fms/${{ needs.guard.outputs.version }}")
          if [ "$status" = 200 ]; then
            echo "::notice::fms ${{ needs.guard.outputs.version }} is already on crates.io; not publishing"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: rust-lang/crates-io-auth-action@v1
        if: steps.published.outputs.skip != 'true'
        id: auth
      - run: cargo publish --locked
        if: steps.published.outputs.skip != 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  # Last: the release page is the announcement, so it goes up once the crate is installable.
  github-release:
    name: github release
    needs: [guard, binaries, crates-io]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      # Whoever downloads a binary should be able to check it without trusting the page.
      - name: Checksums
        working-directory: artifacts
        run: sha256sum -- *.tar.gz *.zip > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: sha256sums
          path: artifacts/SHA256SUMS
          if-no-files-found: error
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The changelog entry is the release note; `--generate-notes` appends the commit list.
          awk -v v="${{ needs.guard.outputs.version }}" '
            $0 ~ "^## \\[" v "\\]" { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          gh release create "${{ needs.guard.outputs.tag }}" \
            --title "${{ needs.guard.outputs.tag }}" \
            --notes-file notes.md \
            --generate-notes \
            --verify-tag \
            artifacts/*

  # Homebrew: Formula/fms.rb in hupe1980/homebrew-tap, for a release only (a `-` in the version
  # is a pre-release). Owner setup, once: install the tap's GitHub App (the one rustberg and
  # iec61850-kit use — contents read/write on hupe1980/homebrew-tap only) on this repository too,
  # and create a GitHub environment `homebrew` (deployment rule: tags `v*`) holding its
  # HOMEBREW_APP_ID and HOMEBREW_APP_PRIVATE_KEY. Actions are pinned by commit because this job
  # holds a write token.
  tap:
    name: homebrew tap
    needs: [guard, github-release]
    if: github.event_name == 'push' && !contains(needs.guard.outputs.version, '-')
    runs-on: ubuntu-latest
    environment: homebrew
    env:
      VERSION: ${{ needs.guard.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sha256sums
          path: dist
      # A short-lived installation token that can write to the tap and nothing else.
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          app-id: ${{ secrets.HOMEBREW_APP_ID }}
          private-key: ${{ secrets.HOMEBREW_APP_PRIVATE_KEY }}
          owner: hupe1980
          repositories: homebrew-tap
          permission-contents: write
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: hupe1980/homebrew-tap
          token: ${{ steps.app-token.outputs.token }}
          path: tap
          persist-credentials: true
      - name: Update the formula
        run: |
          mkdir -p tap/Formula
          packaging/homebrew/formula.sh "$VERSION" dist/SHA256SUMS > tap/Formula/fms.rb
          cd tap
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "fms release"
            git config user.email "fms-release@users.noreply.github.com"
            git add Formula/fms.rb
            git commit -m "fms $VERSION"
            git push
          fi

  # What a user gets from the tap installs, passes its own test (a floor and a reference day),
  # and reports the version that was tagged — on clean machines.
  brew:
    name: brew install ${{ matrix.os }}
    needs: [guard, tap]
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - if: runner.os == 'Linux'
        run: |
          if [ ! -x /home/linuxbrew/.linuxbrew/bin/brew ]; then
            NONINTERACTIVE=1 /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
          fi
          echo "/home/linuxbrew/.linuxbrew/bin" >> "$GITHUB_PATH"
      - run: |
          brew install hupe1980/tap/fms
          brew test fms
          [ "$(fms --version)" = "fms ${{ needs.guard.outputs.version }}" ]
