# Zola configuration for the fms site. Built by .github/workflows/site.yml. No theme, no npm,
# no CDN: the page fetches nothing it does not ship, and its data is generated by the library
# itself (tests/site.rs fails when it is stale).

base_url = "https://hupe1980.github.io/fms"
title = "fms"
description = "A Flexibilitätsmanagementsystem in Rust: the DSO side of § 14a EnWG — grid state, floor-respecting reductions, dispatch tracking and a tamper-evident evidence log."
default_language = "en"
compile_sass = false
minify_html = false
build_search_index = false
generate_feeds = false

[markdown]
smart_punctuation = false
insert_anchor_links = "right"

[markdown.highlighting]
style = "class"
light_theme = "ayu-light"
dark_theme = "ayu-dark"

[extra]
repo = "https://github.com/hupe1980/fms"
crate = "https://crates.io/crates/fms"
docs = "https://docs.rs/fms"
